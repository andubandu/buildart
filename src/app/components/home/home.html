<div class="stage" [class.is-loading]="!translationService.isLoaded()">
  <main #deck id="deck" class="deck">
    <section class="intro">
      <div class="intro__inner">
        <p class="intro__eyebrow">{{ 'home.eyebrow' | translate }}</p>
        <h1 class="intro__wordmark">Build<span>art</span></h1>
        <p class="intro__lede">
          {{ 'home.lede' | translate }}
        </p>
        <p class="intro__hint">{{ 'home.hint' | translate }} <span aria-hidden="true">→</span></p>
      </div>
    </section>

    @for (project of projects(); track project.id; let i = $index) {
      <a
        class="panel-link"
        [routerLink]="['/project', project.id]"
        [attr.aria-label]="project.name + ' - ' + getProjectLocation(project) + (getProjectSubtitle(project) ? ' — ' + getProjectSubtitle(project) : '')"
      >
        <app-project-panel [id]="'panel-' + project.id" [project]="project" [index]="i + 1" />
      </a>
    }

    <section class="outro">
      <div class="outro__inner">
        <h2 [innerHTML]="'home.outro_title' | translate"></h2>
        <a
          class="outro__btn"
          href="mailto:buildart.office@gmail.com?subject=Inquiry%20-%20Buildart%20Viewing"
        >
          {{ 'home.book_viewing' | translate }}
        </a>
      </div>
    </section>
  </main>

  <div
    #scrollbar
    class="scrollbar"
    role="scrollbar"
    aria-controls="deck"
    aria-orientation="horizontal"
    [attr.aria-label]="'home.scrollbar_label' | translate"
    [attr.aria-valuenow]="thumbLeft()"
    aria-valuemin="0"
    [attr.aria-valuemax]="100 - thumbWidth()"
    tabindex="0"
  >
    <span
      class="scrollbar__thumb"
      [style.width.%]="thumbWidth()"
      [style.left.%]="thumbLeft()"
    ></span>
  </div>
</div>
